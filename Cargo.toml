[package]
name = "microvibe"
version = "0.1.0"
edition = "2021"
description = "Ultra-light CLI coding agent in Rust"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
colored = "2"
dirs = "5"
glob = "0.3"
regex = "1"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
bytes = "1"
toml = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
